/* ---------- zone / depth HUD ---------- */
function drawZoneHud() {
  const list = ZONES[world.kind];
  const z = list[world.zone - 1];

  g.save();
  g.fillStyle = "rgba(0,0,0,.5)";
  roundRect(CW / 2 - 175, 10, 350, world.vertical ? 52 : 34, 12); g.fill();
  g.fillStyle = z.n >= 5 ? "#ff5ec7" : (z.n >= 3 ? "#ffcc00" : "#fff");
  g.font = "bold 19px sans-serif"; g.textAlign = "center";
  g.fillText(PLACES[world.kind].emoji + " " + z.name + "   (x" + z.bonus + " points)", CW / 2, 33);
  if (world.vertical) {
    g.fillStyle = "#bfe6ff";
    g.font = "bold 15px sans-serif";
    const line = world.kind === "ocean"
      ? depthFeet(world.player.y).toLocaleString() + " ft down   •   deepest ever " + state.deepest.toLocaleString() + " ft"
      : depthFeet(world.player.y).toLocaleString() + " ft underground";
    g.fillText(line, CW / 2, 53);
  }
  g.restore();

  /* the field notebook keeps a running count of what's still missing here */
  if (state.gear.notebook) {
    const here = CREATURES.filter(c => c.where === world.kind);
    const got = here.filter(c => state.found.includes(c.id)).length;
    g.save();
    g.fillStyle = "rgba(0,0,0,.5)";
    roundRect(CW / 2 - 110, world.vertical ? 66 : 48, 220, 26, 9); g.fill();
    g.fillStyle = "#caffbf";
    g.font = "bold 14px sans-serif"; g.textAlign = "center";
    g.fillText("📓 " + got + " of " + here.length + " found here — " +
               (here.length - got) + " to go", CW / 2, (world.vertical ? 66 : 48) + 18);
    g.restore();
  }

  const w = 16, h = Math.min(360, CH - 140), x = CW - 44, y = 78;
  g.save();
  g.fillStyle = "rgba(0,0,0,.45)";
  roundRect(x - 6, y - 6, w + 12, h + 12, 9); g.fill();

  const METER = {
    ocean:       ["rgba(120,210,255,.8)", "rgba(60,140,200,.8)", "rgba(30,60,110,.85)",
                  "rgba(10,18,45,.9)", "rgba(30,6,40,.92)", "rgba(90,20,10,.95)"],
    land:        ["rgba(126,201,127,.85)", "rgba(141,154,84,.85)", "rgba(216,187,122,.9)"],
    island:      ["rgba(120,210,180,.85)", "rgba(90,180,140,.85)", "rgba(200,160,90,.9)",
                  "rgba(120,120,200,.9)"],
    underground: ["rgba(123,90,58,.9)", "rgba(59,48,56,.9)", "rgba(45,42,68,.92)", "rgba(60,14,22,.95)"]
  };
  const colors = METER[world.kind] || METER.ocean;
  const stops = list.length;
  for (let i = 0; i < stops; i++) {
    g.fillStyle = colors[i] || "rgba(255,255,255,.3)";
    roundRect(x, y + (h / stops) * i, w, h / stops - 2, 5); g.fill();
    /* a lock on the parts his suit can't reach */
    if (i + 1 > maxZoneAllowed(world.kind)) {
      g.fillStyle = "rgba(255,255,255,.8)";
      g.font = "11px sans-serif"; g.textAlign = "center";
      g.fillText("🔒", x + w / 2, y + (h / stops) * i + h / stops / 2 + 4);
    }
  }

  const frac = world.vertical
    ? (world.player.y - world.surface) / (world.ground - world.surface)
    : world.player.x / world.w;
  const py = y + Math.max(0, Math.min(1, frac)) * h;
  g.fillStyle = "#ffcc00";
  g.beginPath(); g.arc(x + w / 2, py, 8, 0, 6.3); g.fill();
  g.fillStyle = "#10203a";
  g.font = "bold 10px sans-serif"; g.textAlign = "center";
  g.fillText(world.vertical ? "▼" : "▶", x + w / 2, py + 3.5);
  g.restore();
}

/* ---------- loop ---------- */
function loop() {
  if (document.getElementById("explore").classList.contains("active")) { update(); render(); }
  requestAnimationFrame(loop);
}

/* ============================================================
   FINDING A CREATURE
   ============================================================ */
function discover(c, usedMagic, zone) {
  const tier = TIERS[c.tier];
  const isNew = !state.found.includes(c.id);
  let points = tier.points * zone.bonus;
  if (isNew) points *= 2;

  if (c.breaksTrap) {
    points = 0;
    playBreak();
  } else {
    state.score += points;
    if (c.tier === "mythic") { screenFlash(); playMythicFanfare(); confettiBurst(400); }
    else if (tier.stars >= 5) { screenFlash(); playFanfare(); confettiBurst(240); }
    else if (tier.stars >= 3) { playFanfare(); confettiBurst(90); }
    else { [523, 659, 784].slice(0, tier.stars + 1).forEach((n, i) => setTimeout(() => beep(n, 170), i * 85)); }
  }
  if (isNew) state.found.push(c.id);
  state.counts[c.id] = (state.counts[c.id] || 0) + 1;
  if (c.givesMagic) state.magic++;

  save();
  refresh();
  fillCard(c, { isNew: isNew, points: points, usedMagic: usedMagic, zone: zone });
  document.getElementById("overlay").classList.add("show");
}

function screenFlash() {
  const f = document.getElementById("flash");
  f.classList.add("on");
  setTimeout(() => f.classList.remove("on"), 90);
}

function fillCard(c, opts) {
  opts = opts || {};
  const tier = TIERS[c.tier];

  document.getElementById("card").classList.toggle("mythic", c.tier === "mythic");

  const img = document.getElementById("cardPhoto");
  const em = document.getElementById("cardEmoji");
  const src = photoOf(c.id);
  if (src) {
    img.style.display = "block";
    em.style.display = "none";
    img.onerror = () => { img.style.display = "none"; em.style.display = "block"; };
    img.src = src;
    img.alt = c.name;
  } else {
    img.style.display = "none";
    em.style.display = "block";
  }
  em.textContent = c.emoji;

  document.getElementById("cardName").textContent =
    (c.mythic ? "✨ " : "") + (opts.isNew ? "NEW! " : (opts.points != null && (state.counts[c.id] || 0) > 1 ? "AGAIN! " : "")) + c.name;

  const tg = document.getElementById("cardTier");
  tg.textContent = tier.label;
  tg.style.background = tier.color;

  document.getElementById("cardStars").textContent =
    c.tier === "mythic" ? "🌟🌟🌟🌟🌟" : "⭐".repeat(tier.stars) + "☆".repeat(5 - tier.stars);

  const pts = document.getElementById("cardPoints");
  if (c.breaksTrap) {
    pts.textContent = "💥 Oh no! It was too big — your magic trap BROKE!";
  } else if (opts.points != null) {
    const WHY = {
      ocean: "for going deep", underground: "for digging deep",
      land: "for going way out", island: "for sailing this far"
    };
    pts.textContent = "+" + opts.points.toLocaleString() + " points" +
      (opts.zone && opts.zone.bonus > 1
        ? "  (x" + opts.zone.bonus + " " + (WHY[c.where] || "for going deep") + "!)" : "") +
      (opts.isNew ? "  (doubled — brand new!)" : "");
  } else {
    pts.textContent = "Worth " + tier.points.toLocaleString() + " points";
  }

  const where = document.getElementById("cardWhere");
  const zoneNames = c.zones.map(n => ZONES[c.where][n - 1].name).join(" • ");
  let line = "Lives in: " + zoneNames;
  if (c.endemicTo) {
    line += '<br><span style="color:#0b7a5a"><b>I live on ' + c.endemicTo +
            ' and NOWHERE else on Earth.</b></span>';
  }
  if (c.magicOnly) line += "  🪄 (needs the magic trap)";
  if (c.mythic) line += "<br><b>Hardly anybody in the whole world has ever seen me.</b>";
  if (c.givesMagic) line += "<br>🪄 A crab! You earned a MAGIC TRAP!";
  if (opts.usedMagic && !c.breaksTrap) line += "<br>The magic trap grew GIANT to catch it!";

  /* meeting one again is something to brag about, not a repeat */
  const times = state.counts[c.id] || 0;
  if (times > 1) {
    line += '<br><span style="color:#b06a00"><b>You have found this one ' + times + " times!</b>" +
            (c.mythic ? " 🤯" : "") + "</span>";
  }
  where.innerHTML = line;

  const ul = document.getElementById("cardFacts");
  ul.innerHTML = "";
  c.facts.forEach(f => {
    const li = document.createElement("li");
    li.textContent = f;
    ul.appendChild(li);
  });

  document.getElementById("cardCredit").innerHTML = PHOTOS[c.id]
    ? 'Photo from <a href="' + PHOTOS[c.id].url + '" target="_blank">Wikipedia</a>' : "";
}

function closeCard() { document.getElementById("overlay").classList.remove("show"); }

/* ============================================================
   THE SHOP
   ============================================================ */
function ownedLevel(itemId) {
  const item = SHOP.find(i => i.id === itemId);
  if (!item || item.repeat || !item.gear) return false;
  return (state.gear[item.gear] || 0) >= item.level;
}

function buy(itemId) {
  const item = SHOP.find(i => i.id === itemId);
  if (!item) return;
  if (ownedLevel(itemId)) return;
  if (item.needs && !ownedLevel(item.needs)) { shopNote("You need the one before it first!"); return; }
  if (state.score < item.cost) { shopNote("Not enough points yet — go find more creatures! ⭐"); return; }

  state.score -= item.cost;
  if (item.id === "magic") state.magic++;
  else state.gear[item.gear] = Math.max(state.gear[item.gear] || 0, item.level);

  save();
  playBuy();
  confettiBurst(70);
  shopNote("YES! You got the " + item.name + "! " + item.emoji);

  /* buying a snorkel mid-island should add the tide pools right away */
  if (item.id === "snorkel" && world && world.kind === "island") {
    ZONES.island.forEach(z => { for (let i = 0; i < 3; i++) world.spots.push(makeSpot(z.n)); });
  }
  showShop();
  refresh();
}

function shopNote(msg) {
  const el = document.getElementById("shopNote");
  el.textContent = msg;
  clearTimeout(shopNote._t);
  shopNote._t = setTimeout(() => { el.textContent = ""; }, 4000);
}

function showShop() {
  const grid = document.getElementById("shopGrid");
  grid.innerHTML = "";
  document.getElementById("scoreNum").textContent = state.score.toLocaleString();
  document.getElementById("magicNum").textContent = state.magic;
  document.getElementById("shopPoints").textContent =
    "You have " + state.score.toLocaleString() + " points  ⭐";

  /* the place he's exploring right now comes first */
  const order = ["ocean", "land", "island", "underground", "any"];
  const here = world ? world.kind : null;
  if (here) order.splice(order.indexOf(here), 1), order.unshift(here);

  order.forEach(place => {
    const items = SHOP.filter(i => i.where === place);
    if (!items.length) return;

    const head = document.createElement("h3");
    head.className = "shopPlace" + (place === here ? " current" : "");
    head.textContent = PLACES[place].emoji + " " + PLACES[place].name +
                       (place === "any" ? "" : " gear") +
                       (place === here ? "  — where you are now" : "");
    grid.appendChild(head);

    const row = document.createElement("div");
    row.className = "shopRow";
    items.forEach(item => row.appendChild(shopCard(item)));
    grid.appendChild(row);
  });

  labelBackButtons();
  show("shop");
}

function shopCard(item) {
  const owned = ownedLevel(item.id);
  const locked = item.needs && !ownedLevel(item.needs);
  const div = document.createElement("div");
  div.className = "shopItem" + (owned ? " owned" : "") + (locked ? " locked" : "");
  div.innerHTML =
    '<div class="ic">' + item.emoji + "</div>" +
    '<div class="nm">' + item.name + "</div>" +
    '<div class="bl">' + item.blurb + "</div>" +
    '<div class="pr">' + (owned ? "✅ You have it!" : item.cost.toLocaleString() + " points") + "</div>";

  if (!owned) {
    const b = document.createElement("button");
    const afford = state.score >= item.cost;
    b.className = "btn small " + (afford && !locked ? "gold" : "gray");
    b.textContent = locked ? "🔒 Locked" : (afford ? "BUY IT!" : "Need more points");
    b.disabled = locked || !afford;
    b.onclick = () => buy(item.id);
    div.appendChild(b);
  }
  return div;
}

/* You need the boat before the islands are anywhere you can go. */
function tryStart(kind) {
  if (!canReach(kind)) {
    const boat = SHOP.find(i => i.id === "boat");
    updateHomeText();
    document.getElementById("islandHint").innerHTML =
      "🔒 You need <b>The Boat</b> (" + boat.cost.toLocaleString() + " points) — it's in the 🛒 shop!";
    beep(160, 240, "sawtooth", .08);
    return;
  }
  startWorld(kind);
}

/* ---------- screens ---------- */
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function goHome() { world = null; magicArmed = false; updateHomeText(); show("home"); }

/* Leaving the shop or the book puts him back exactly where he was.
   If he was in the middle of a dive, the dive is still going. */
function backFromMenu() {
  closeCard();
  if (world) show("explore");
  else { updateHomeText(); show("home"); }
}

/* the Back buttons say where they go */
function labelBackButtons() {
  const BACK = {
    ocean: "⬅️ Back to my dive", land: "⬅️ Back to exploring",
    island: "⬅️ Back to the island", underground: "⬅️ Back down the hole"
  };
  const label = world ? BACK[world.kind] : "⬅️ Back home";
  document.querySelectorAll(".big-back").forEach(b => { b.textContent = label; });
}

function updateHomeText() {
  const suits = ["", "just your snorkel", "the Deep Suit", "the VOLCANO SUIT"];
  const digs  = ["", "your bare hands", "a Shovel", "a PICKAXE"];
  document.getElementById("homeHowto").innerHTML =
    "🎮 <b>Arrow keys</b> to move (or click where you want to go). Get close and press <b>SPACE</b>.<br>" +
    "🤿 Diving with " + suits[state.gear.suit] + " — you can reach <b>" +
      ZONES.ocean[maxZoneAllowed("ocean") - 1].name + "</b>.<br>" +
    "⛏️ Digging with " + digs[state.gear.dig] + " — you can reach <b>" +
      ZONES.underground[maxZoneAllowed("underground") - 1].name + "</b>.<br>" +
    "🏆 Deepest dive ever: <b>" + state.deepest.toLocaleString() + " feet</b>";

  /* the islands stay locked until he buys the boat */
  const card = document.getElementById("islandCard");
  const hint = document.getElementById("islandHint");
  if (card && hint) {
    const boat = SHOP.find(i => i.id === "boat");
    card.classList.toggle("locked", !canReach("island"));
    hint.innerHTML = canReach("island")
      ? "Animals found nowhere else on Earth"
      : "🔒 Needs <b>The Boat</b> — " + boat.cost.toLocaleString() + " points";
  }
}

function refresh() {
  document.getElementById("scoreNum").textContent = state.score.toLocaleString();
  document.getElementById("magicNum").textContent = state.magic;
  const btn = document.getElementById("magicBtn");
  btn.disabled = state.magic < 1;
  btn.textContent = magicArmed ? "🪄 MAGIC ON!" : "🪄 Magic";
  updateHomeText();
  updateHint();
}

function updateHint() {
  const h = document.getElementById("hint");
  if (!world || flashHint._m) return;
  const near = nearestSpot();
  h.classList.toggle("magicOn", magicArmed && !world.reveal);

  const THING = { ocean: "trap", land: "rock", island: "nest", underground: "burrow" };
  const thing = THING[world.kind];
  const OPEN = {
    ocean: "open the trap!", land: "flip the rock!",
    island: "look in the nest!", underground: "dig out the burrow!"
  };
  const GO = {
    ocean: "🏊 Swim DOWN — the deeper you go, the weirder they get!",
    land: "🚶 Walk RIGHT for rarer creatures! (up = jump)",
    island: "⛵ Head RIGHT to the next island — each one has animals found nowhere else!",
    underground: "⛏️ Dig DOWN — everything down there is blind and pale and strange."
  };

  if (world.reveal) {
    h.textContent = "Ohhh what is it?!";
  } else if (world.blocked > 0) {
    h.textContent = "🔒 You need the " + (nextGateItem(world.kind) || "next gear") + " from the 🛒 shop to get past here.";
  } else if (magicArmed) {
    h.textContent = "🪄 Magic is ON! Open a " + thing + " to catch something HUGE!";
  } else if (near) {
    h.textContent = "Press SPACE to " + OPEN[world.kind];
  } else {
    h.textContent = GO[world.kind];
  }
}

/* ---------- the book ---------- */
function showBook() {
  const body = document.getElementById("bookBody");
  body.innerHTML = "";

  /* the mythic shrine goes first */
  const mythics = CREATURES.filter(c => c.tier === "mythic");
  const shrine = document.createElement("div");
  shrine.className = "mythicShrine";
  const st = document.createElement("h3");
  st.style.color = "#ff5ec7";
  st.textContent = "★ MYTHIC — the rarest of all ★";
  shrine.appendChild(st);
  shrine.appendChild(buildGrid(mythics));
  body.appendChild(shrine);

  ["land", "ocean", "island", "underground"].forEach(where => {
    const h3 = document.createElement("h3");
    h3.textContent = PLACES[where].emoji + " " + PLACES[where].name;
    body.appendChild(h3);

    if (where === "island") {
      const note = document.createElement("div");
      note.className = "islandNote";
      note.textContent = "Every animal on these islands lives there and nowhere else in the world. " +
        "They were cut off by the sea for so long that they turned into something new.";
      body.appendChild(note);
    }

    ZONES[where].forEach(zone => {
      const inZone = CREATURES.filter(c => c.where === where && c.tier !== "mythic" && c.zones[0] === zone.n);
      if (!inZone.length) return;
      const found = inZone.filter(c => state.found.includes(c.id)).length;
      const label = document.createElement("div");
      label.className = "zoneLabel";
      label.textContent = zone.name + " — " + found + " of " + inZone.length +
        (zone.needs ? "   (needs the " + zone.needs.item + ")" : "");
      body.appendChild(label);
      body.appendChild(buildGrid(inZone));
    });
  });

  document.getElementById("bookCount").textContent =
    "You have discovered " + state.found.length + " of " + CREATURES.length + " creatures!";
  labelBackButtons();
  show("book");
}

function buildGrid(list) {
  const grid = document.createElement("div");
  grid.className = "bookGrid";
  list.slice().sort((a, b) => TIERS[a.tier].points - TIERS[b.tier].points).forEach(c => {
    const have = state.found.includes(c.id);
    const cell = document.createElement("button");
    cell.className = "bookCell" + (have ? "" : " locked");
    cell.style.borderColor = have ? TIERS[c.tier].color : "#4a7ab5";

    const src = photoOf(c.id);
    if (have && src) {
      const im = document.createElement("img");
      im.src = src; im.alt = c.name;
      im.onerror = () => { im.replaceWith(makePlaceholder(c.emoji)); };
      cell.appendChild(im);
    } else {
      cell.appendChild(makePlaceholder(have ? c.emoji : "❓"));
    }
    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = have ? c.name : "???";
    cell.appendChild(nm);

    const times = state.counts[c.id] || 0;
    if (times > 1) {
      const badge = document.createElement("span");
      badge.className = "count";
      badge.textContent = "x" + times;
      cell.appendChild(badge);
    }
    if (have) cell.onclick = () => { fillCard(c, {}); document.getElementById("overlay").classList.add("show"); };
    grid.appendChild(cell);
  });
  return grid;
}

function makePlaceholder(txt) {
  const d = document.createElement("div");
  d.className = "ph";
  d.textContent = txt;
  return d;
}

/* ---------- confetti ---------- */
const cvs = document.getElementById("confetti");
const cx = cvs.getContext("2d");
let bits = [];
function sizeConfetti() { cvs.width = innerWidth; cvs.height = innerHeight; }
addEventListener("resize", sizeConfetti);
sizeConfetti();

function confettiBurst(n) {
  const colors = ["#ffcc00", "#ff4d6d", "#4cc9f0", "#80ed99", "#c77dff", "#ff5ec7"];
  for (let i = 0; i < (n || 90); i++) {
    bits.push({
      x: innerWidth / 2, y: innerHeight / 2,
      vx: (Math.random() - .5) * 20, vy: Math.random() * -16 - 3,
      c: pick(colors), s: Math.random() * 9 + 4, life: 130
    });
  }
}
function confettiTick() {
  cx.clearRect(0, 0, cvs.width, cvs.height);
  bits = bits.filter(b => b.life-- > 0);
  bits.forEach(b => {
    b.x += b.vx; b.y += b.vy; b.vy += .45;
    cx.fillStyle = b.c;
    cx.fillRect(b.x, b.y, b.s, b.s);
  });
  requestAnimationFrame(confettiTick);
}
confettiTick();

/* ---------- go! ---------- */
load();
fitCanvas();
refresh();
loop();
</script>
